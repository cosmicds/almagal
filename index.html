<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Google Analytics -->
  <script>
    // Logic derived from https://stackoverflow.com/a/61839170
    const local = (function (hostname=window.location.hostname) {
      return (
        (['localhost', '127.0.0.1', '', '::1'].includes(hostname))
        || (hostname.startsWith('192.168.'))
        || (hostname.startsWith('10.'))
      )
    })();
    if (!local) {
      const script = document.createElement("script");
      script.async = true;
      script.src = "https://www.googletagmanager.com/gtag/js?id=G-C2ELSYY9VC";
      document.head.appendChild(script);
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
  
      gtag('config', 'G-C2ELSYY9VC');
    }
  </script>
  <meta charset="utf-8">

  <!-- Declared here once for the whole app rather than repeated in three
       component stylesheets, which was fetching each face three times over.
       Served as woff2 - 178kB for the pair, against 460kB as TrueType - with the
       .ttf originals kept as a fallback src. Not preloaded: fetching them up
       front only pushes the app bundle back, and `font-display: swap` keeps text
       readable in a fallback face until they land. -->
  <style>
    @font-face {
      font-family: "Highway Gothic Narrow";
      src: url("./fonts/HighwayGothicNarrow.woff2") format("woff2"),
           url("./fonts/HighwayGothicNarrow.ttf") format("truetype");
      font-display: swap;
    }

    @font-face {
      font-family: "Segoe UI Semibold";
      src: url("./fonts/SegoeUISemibold.woff2") format("woff2"),
           url("./fonts/SegoeUISemibold.ttf") format("truetype");
      font-weight: 600;
      font-display: swap;
    }
  </style>

  <!-- Until the bundle has downloaded and Vue has mounted there is nothing to
       show, so hold a black screen rather than a white one and say what is going
       on along the bottom. The markup lives inside the mount element, so Vue
       clears it on its own when the real splash screen takes over. -->
  <style>
    html, body { margin: 0; height: 100%; background-color: #000; }

    #boot-note {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      color: #fff;
      opacity: 0.7;
      font-family: "Highway Gothic Narrow", sans-serif;
      font-size: 0.9rem;
      letter-spacing: 0.04em;
    }

    #boot-note::before {
      content: "";
      width: 0.9em;
      height: 0.9em;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      animation: boot-spin 0.8s linear infinite;
    }

    @keyframes boot-spin { to { transform: rotate(360deg); } }
  </style>

  <!-- WWT fetches its imagery catalog, constellation data and image tiles from
       these hosts as soon as the engine starts. Getting the DNS/TLS handshakes
       out of the way while the bundle is still downloading saves a round trip
       each on the engine-ready path. -->
  <link rel="preconnect" href="//cdn.worldwidetelescope.org" crossorigin>
  <link rel="preconnect" href="//web.wwtassets.org" crossorigin>
  <link rel="preconnect" href="//data1.wwtassets.org" crossorigin>

  <!-- The WTML collections are loaded in sequence (they stack in load order), so
       warm them all up in parallel up front; by the time the chain runs they are
       cache hits. -->
  <link rel="prefetch" href="./GLIMPSE_360.wtml">
  <link rel="prefetch" href="./herschel_spire_rgb.wtml">
  <link rel="prefetch" href="./almagal_tour_images.wtml">
  <link rel="prefetch" href="./almagal.wtml">

  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://projects.cosmicds.cfa.harvard.edu/vue-ds-template/">
  <meta property="og:title" content="A LMAGAL">
  <meta property="og:description" content="A LMAGAL">
  <meta property="og:site_name" content="A LMAGAL">
  <meta property="og:image" content="https://projects.cosmicds.cfa.harvard.edu/vue-ds-template/preview.png">
  <meta property="og:image:secure_url" content="https://projects.cosmicds.cfa.harvard.edu/vue-ds-template/preview.png">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="596">
  <meta property="og:image:height" content="886">
  <meta property="og:image:alt" content="Story preview image">
  <meta name="twitter:site" content="@CosmicDataStory">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:creator" content="@CosmicDataStory">
  <meta name="twitter:image" content="https://projects.cosmicds.cfa.harvard.edu/vue-ds-template/preview.png">
  <link rel="icon" href="https://projects.cosmicds.cfa.harvard.edu/cds-website/cosmicds-favicon.png">
  <link rel="apple-touch-icon" href="https://projects.cosmicds.cfa.harvard.edu/cds-website/cosmicds-favicon-57.png">
  <link rel="apple-touch-icon" sizes="72x72" href="https://projects.cosmicds.cfa.harvard.edu/cds-website/cosmicds-favicon-72.png">
  <link rel="apple-touch-icon" sizes="114x114" href="https://projects.cosmicds.cfa.harvard.edu/cds-website/cosmicds-favicon-114.png">
  <link rel="apple-touch-icon" sizes="144x144" href="https://projects.cosmicds.cfa.harvard.edu/cds-website/cosmicds-favicon-144.png">
  <link rel="shortcut icon" href="https://projects.cosmicds.cfa.harvard.edu/cds-website/cosmicds-favicon.ico">

</head>

<body>

    <strong>This page requires JavaScript to run.</strong>
  </noscript>
  <div id="app-mount">
    <p id="boot-note">Loading ALMAGAL&hellip;</p>
  </div>
  <!-- built files are not auto injected with vite -->
  <script type="module" src="/src/main.ts"></script>
  <!-- built files will be auto injected -->
</body>

</html>
